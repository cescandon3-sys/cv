<script>
  /* Arranque: añade "js" antes de ocultar nada y fija tema e idioma sin parpadeo.
     Tema claro por defecto (como el sitio); ?theme= y ?lang= en la URL mandan sobre la elección guardada. */
  (function () {
    var d = document.documentElement, q = null, t = null, l = null;
    d.classList.add('js');
    try { q = new URLSearchParams(location.search); } catch (e) {}
    t = q && q.get('theme');
    if (t !== 'dark' && t !== 'light') { try { t = localStorage.getItem('cv-theme'); } catch (e) { t = null; } }
    d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    l = q && q.get('lang');
    if (l !== 'es' && l !== 'en') { try { l = localStorage.getItem('cv-lang'); } catch (e) { l = null; } }
    if (l === 'es' || l === 'en') d.setAttribute('lang', l);
  })();
</script>
<style>
/* =============================================================================
   1. TOKENS · medidos en remotehubtech.com (tema claro) + tema oscuro derivado
   ============================================================================= */
:root {
  --canvas: #F2EEE5;            /* fondo de la página */
  --paper: #F7F4EE;             /* encabezado y franjas alternas */
  --card: #FBF9F4;              /* tarjetas */
  --card-2: #EDE7DA;            /* barras de marco y etiquetas */
  --fg: #1A1714;                /* tinta */
  --muted: #6B6257;             /* texto secundario */
  --faint: #8C8275;
  --border: #E4DDCF;            /* bordes suaves y filetes de sección */
  --line: rgba(26, 23, 20, .15);
  --line-2: rgba(26, 23, 20, .25);
  --line-3: rgba(26, 23, 20, .3);
  --stroke: #1A1714;            /* borde fuerte */
  --stamp: 3px 3px 0 0 #1A1714; /* sombra dura */
  --stamp-sm: 2px 2px 0 0 rgba(26, 23, 20, .14);
  --pop: 4px 4px 0 0 rgba(26, 23, 20, .18);
  --accent: #FF5A1F;
  --accent-ink: #A23509;
  --accent-soft: #FFE9DD;
  --accent-ring: rgba(255, 90, 31, .14);
  --on-accent: #1A1714;
  --danger: #C2341F;
  --node: #B9AF9E;
  --screen: #14110D;            /* maquetas de pantalla */
  --screen-2: #1F1B15;
  --on-screen: #FBF9F4;
  --dots: rgba(26, 23, 20, .08);
  --tl-fill: rgba(26, 23, 20, .34);
  --ease: cubic-bezier(.3, 0, .2, 1);   /* "relay" del sitio */
  --rise: cubic-bezier(.2, .7, .2, 1);  /* "title-rise" del sitio */
  --f-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --f-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hdr: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --canvas: #12100E; --paper: #181512; --card: #1E1A16; --card-2: #29241E;
  --fg: #F2EEE5; --muted: #A39A8E; --faint: #8A8175;
  --border: rgba(242, 238, 229, .14); --line: rgba(242, 238, 229, .16);
  --line-2: rgba(242, 238, 229, .26); --line-3: rgba(242, 238, 229, .32);
  --stroke: rgba(242, 238, 229, .78);
  --stamp: 3px 3px 0 0 rgba(242, 238, 229, .3);
  --stamp-sm: 2px 2px 0 0 rgba(0, 0, 0, .55);
  --pop: 4px 4px 0 0 rgba(242, 238, 229, .2);
  --accent-ink: #FF8A5C; --accent-soft: rgba(255, 90, 31, .16); --accent-ring: rgba(255, 90, 31, .22);
  --node: #6F675C;
  --screen: #0B0A08; --screen-2: #17140F;
  --dots: rgba(242, 238, 229, .07);
  --tl-fill: rgba(242, 238, 229, .34);
  color-scheme: dark;
}

/* =============================================================================
   2. BASE
   ============================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--hdr) + 8px); }
body {
  margin: 0; min-height: 100vh; background: var(--canvas); color: var(--fg);
  font: 400 16px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-wrap: break-word;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.025em; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; margin: 0; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: rgba(255, 90, 31, .18); }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
main:focus { outline: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.print-only { display: none; }
.tnum { font-variant-numeric: tabular-nums; }
.ico { width: 1.15em; height: 1.15em; flex: none; }
.noscript { max-width: 640px; margin: 96px auto; padding: 0 16px; font: 500 18px/1.5 var(--f-sans); }

/* Contenedor del sitio: max-w-6xl (1152 px) con 16/24/32 px a los lados */
.wrap { width: 100%; max-width: 72rem; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 640px) { .wrap { padding-inline: 24px; } }
@media (min-width: 1024px) { .wrap { padding-inline: 32px; } }

/* Saltar al contenido */
.skip {
  position: fixed; left: 16px; top: 12px; z-index: 70; padding: 12px 16px; border: 1px solid var(--stroke); border-radius: 4px;
  background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; box-shadow: var(--stamp);
  transform: translateY(-160%); transition: transform .2s var(--ease);
}
.skip:focus, .skip:focus-visible { transform: none; }

/* =============================================================================
   3. COMPONENTES DEL SITIO
   ============================================================================= */
/* Franjas: alternan papel y papel claro, separadas por un filete */
.band { position: relative; background: var(--canvas); border-top: 1px solid var(--border); }
.band--paper { background: var(--paper); }
.band--dark { background: var(--screen); color: var(--on-screen); border-top-color: var(--screen); }
.rail { position: relative; padding-block: 80px; }
@media (min-width: 640px) { .rail { padding-block: 96px; } }
@media (min-width: 1024px) { .rail { padding-block: 112px; padding-left: 64px; } }

/* Línea de tiempo global: filete vertical con un punto en cada encabezado; se dibuja con el scroll */
.tl { display: none; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: var(--line); pointer-events: none; }
.tl i { position: absolute; inset: 0; background: var(--tl-fill); transform-origin: 50% 0; transform: scaleY(0); }
.band--dark .tl { background: rgba(251, 249, 244, .15); }
.band--dark .tl i { background: rgba(251, 249, 244, .45); }
@media (min-width: 1024px) { .tl { display: block; } }

/* Encabezado de sección: punto + número gris + nombre en tinta + filete hasta el borde */
.lbl { position: relative; display: flex; align-items: center; gap: 12px; }
.h2__print { display: none; }
.lbl__dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); }
@media (min-width: 1024px) { .lbl__dot { position: absolute; left: -64px; top: 50%; transform: translate(-50%, -50%); } }
.lbl__n { flex: none; font: 400 11px/1 var(--f-mono); letter-spacing: .18em; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl__rule { flex: 1; min-width: 24px; height: 1px; background: var(--line); }
.kicker { font: 400 11px/1.5 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.kicker--fg { color: var(--fg); }
.band--dark .lbl__dot { background: var(--on-screen); }
.band--dark .lbl__n { color: rgba(251, 249, 244, .6); }
.band--dark .lbl .kicker { color: rgba(251, 249, 244, .75); }
.band--dark .lbl__rule { background: rgba(251, 249, 244, .15); }
.sublbl { display: flex; align-items: center; gap: 12px; }
.sublbl .lbl__rule { min-width: 16px; }

/* Títulos: h2 del sitio (32 → 36/40 → 52/40) y h1 del sitio (36 → 48 → 56) */
.h2 { margin-top: 20px; max-width: 48rem; font-size: 32px; line-height: 1.04; text-wrap: balance; }
@media (min-width: 640px) { .h2 { font-size: 36px; line-height: 40px; } }
@media (min-width: 1024px) { .h2 { font-size: 52px; } }
.h-xl { font-size: 36px; line-height: .98; text-wrap: balance; }
@media (min-width: 640px) { .h-xl { font-size: 48px; line-height: 1; } }
@media (min-width: 1280px) { .h-xl { font-size: 56px; } }
.band--dark .h2 { color: var(--on-screen); }
.lead { font-size: 18px; line-height: 1.625; color: var(--muted); text-wrap: pretty; }
.txt { line-height: 1.625; color: var(--muted); text-wrap: pretty; }
.txt-sm { font-size: 14px; line-height: 1.625; color: var(--muted); text-wrap: pretty; }

/* Botones: borde de tinta, radio 4 px y sombra dura; al pasar se levantan, al presionar se hunden */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px;
  border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); color: var(--fg); box-shadow: var(--stamp-sm);
  font: 500 16px/1.5 var(--f-sans); text-align: center; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background-color .15s var(--ease), color .15s var(--ease);
}
@media (min-width: 640px) { .btn { padding-inline: 24px; } }
.btn:hover, .btn:focus-visible { transform: translate(-1px, -1px); box-shadow: var(--stamp); }
.btn:active, .btn.is-pressed { transform: translate(2px, 2px); box-shadow: none; }
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--stamp); }
.btn--primary:hover, .btn--primary:focus-visible { box-shadow: var(--pop); }
.btn--primary:active, .btn--primary.is-pressed { transform: translate(3px, 3px); box-shadow: none; }
.btn .ico { width: 18px; height: 18px; transition: transform .15s var(--ease); }
.btn:hover .ico--go, .btn:focus-visible .ico--go { transform: translateX(2px); }
.btn--sm { min-height: 44px; padding: 8px 16px; font-size: 14px; line-height: 20px; }
.ibtn {
  display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; border: 1px solid var(--stroke); border-radius: 4px;
  background: var(--card); color: var(--fg); box-shadow: var(--stamp-sm);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease);
}
.ibtn:hover, .ibtn:focus-visible { transform: translate(-1px, -1px); box-shadow: var(--stamp); }
.ibtn:active { transform: translate(2px, 2px); box-shadow: none; }
.ibtn .ico { width: 20px; height: 20px; }

/* Pestañas o segmentos (idioma): el activo en tinta, hundido */
.seg { display: inline-flex; gap: 6px; }
.seg__btn {
  min-width: 44px; height: 44px; padding: 0 10px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card);
  box-shadow: var(--stamp-sm); font: 500 14px/1 var(--f-sans);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background-color .15s var(--ease), color .15s var(--ease);
}
.seg__btn:hover { transform: translate(-1px, -1px); box-shadow: var(--stamp); }
.seg__btn[aria-pressed="true"] { background: var(--fg); color: var(--card); transform: translate(2px, 2px); box-shadow: none; cursor: default; }

/* Puntos de estado (late como en el sitio), chips y etiquetas */
.node { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--node); }
.node.is-live { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(.92); } }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 2px;
  background: var(--accent-soft); color: var(--fg); font: 400 10px/1.5 var(--f-mono); letter-spacing: .14em; text-transform: uppercase;
}
.chip--plain { background: var(--paper); }
.tag {
  align-self: flex-start; display: inline-block; padding: 2px 6px; border-radius: 2px; background: var(--card-2); color: var(--fg);
  font: 400 11px/1.5 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
}
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--paper); font: 400 11px/1.5 var(--f-mono); color: var(--fg); }
.mono-xs { font: 400 11px/1.5 var(--f-mono); letter-spacing: .08em; color: var(--muted); }

/* Lista con visto (la "L" girada del sitio) */
.checks { display: grid; gap: 20px; }
.checks li { position: relative; padding-left: 32px; line-height: 1.625; color: var(--muted); }
.checks li::before {
  content: ""; position: absolute; left: 2px; top: .45em; width: .95rem; height: .45rem;
  border-left: 2px solid var(--fg); border-bottom: 2px solid var(--fg); transform: rotate(-45deg);
}
.checks--sm { gap: 10px; }
.checks--sm li { padding-left: 22px; font-size: 14px; line-height: 1.375; }
.checks--sm li::before { left: 0; top: .38em; width: .85rem; height: .4rem; }

/* Tarjetas y marcos */
.card { display: flex; flex-direction: column; min-width: 0; padding: 20px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); }
.card__ico { width: 24px; height: 24px; color: var(--fg); }
.card__t { margin-top: 20px; font-size: 18px; line-height: 1.25; }
.card .tag { margin-top: 8px; }
.card .txt-sm { margin-top: 12px; }
.cards { display: grid; gap: 16px; margin-top: 48px; }
@media (min-width: 640px) { .cards { margin-top: 64px; } .cards--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .cards { gap: 20px; } .cards--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cards--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cards--lang { max-width: 44rem; }
.frame { min-width: 0; overflow: hidden; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); box-shadow: var(--stamp); }
.frame__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 12px; border-bottom: 1px solid var(--stroke); background: var(--card-2); }
@media (min-width: 640px) { .frame__bar { padding-inline: 16px; } }
.frame__rule { flex: 1; min-width: 16px; height: 1px; background: var(--line); }
.mock { position: relative; min-width: 0; overflow: hidden; padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: var(--stamp-sm); }

/* Botón de maqueta (13 px, se hunde cuando el cursor lo presiona) */
.mbtn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 6px 12px; border: 1px solid var(--stroke);
  border-radius: 2px; background: var(--card); color: var(--fg); box-shadow: var(--stamp-sm); font: 600 13px/1.375 var(--f-sans); white-space: nowrap;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background-color .15s var(--ease), color .15s var(--ease);
}
.mbtn.is-pressed { transform: translate(2px, 2px); box-shadow: none; background: var(--fg); color: var(--card); }
.mbtn--danger { background: var(--danger); color: #FBF9F4; border-color: #1A1714; box-shadow: 3px 3px 0 0 #1A1714; }
.mbtn--danger.is-pressed { transform: translate(3px, 3px); box-shadow: none; background: #9E2A18; color: #FBF9F4; }

/* Cursor de las maquetas */
.cur { position: absolute; left: 0; top: 0; z-index: 4; width: 17px; height: 23px; pointer-events: none; transform: translate(var(--x, 0), var(--y, 0)); transition: transform .8s var(--ease), opacity .3s ease; }

.mock__field { display: flex; align-items: center; flex: 1 1 6.5rem; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--paper); font: 400 14px/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.mock__stage > * { grid-area: 1 / 1; min-height: 100px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); }
.mock__ph { background-image: radial-gradient(circle, var(--dots) 1px, transparent 1px); background-size: 16px 16px; }
.mock__panel { padding: 12px; border-color: var(--line-2); opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .25s var(--ease), transform .25s var(--ease), visibility 0s linear .25s; }
.mock__panel p { display: flex; font-size: 13px; font-weight: 600; line-height: 1.375; }
.mock__btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
[data-state="request"] .mock__panel--req, [data-state="ok"] .mock__panel--ok { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.mock__tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.mock__tabs li { padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--paper); font: 400 11px/1.5 var(--f-mono); transition: background-color .15s var(--ease), color .15s var(--ease); }
.mock__tabs li.is-on { background: var(--fg); border-color: var(--fg); color: var(--card); }
.mock__file { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; font: 400 11px/1.5 var(--f-mono); color: var(--muted); }
.mock__file b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 400; color: var(--fg); }
.mock__bar { height: 4px; margin-top: 6px; overflow: hidden; border-radius: 2px; background: var(--card-2); }
.mock__bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(.64); }
.mock__bar.is-run i { transition: transform 2.4s var(--ease); }

/* Colegios y universidades: sala de cómputo con reservas por turnos */
.edu { display: grid; gap: 40px; margin-top: 80px; }
@media (min-width: 1024px) { .edu { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: center; gap: 64px; margin-top: 96px; } }
.edu__t { margin-top: 20px; max-width: 48rem; font-size: 32px; line-height: 1.04; text-wrap: balance; }
@media (min-width: 640px) { .edu__t { font-size: 36px; line-height: 40px; } }
@media (min-width: 1024px) { .edu__t { font-size: 44px; } }
.edu .lead { margin-top: 24px; max-width: 36rem; }
.lab { max-width: 28rem; padding: 10px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); box-shadow: var(--stamp); }
@media (min-width: 1024px) { .lab { max-width: none; } }
.lab__screen { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 2px; background: var(--paper) radial-gradient(circle, var(--dots) 1px, transparent 1px) 0 0 / 14px 14px; color: var(--fg); }
.lab__svg { position: absolute; left: 6%; top: 9%; width: 88%; height: 72%; overflow: visible; }
.lab__svg .mon { fill: var(--card); }
.lab__svg .desk { stroke: var(--line-3); }
.lab__svg .led { fill: var(--node); }
.lab__svg .led-on { fill: #FF5A1F; opacity: 0; }
.is-in .lab__svg .led-on { animation: led 9s steps(1, end) infinite; animation-delay: calc(var(--k) * .3s + .4s); }
@keyframes led { 0% { opacity: 0; } 3% { opacity: 1; } 5% { opacity: .3; } 7%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
.lab__slot { position: absolute; left: 6%; bottom: 7%; }
.lab figcaption { display: flex; align-items: center; gap: 8px; padding: 12px 4px 2px; }

/* Seguridad y privacidad: franja oscura con el aviso "Estás siendo controlado por…" */
.sec-grid { display: grid; gap: 48px; margin-top: 48px; }
@media (min-width: 640px) { .sec-grid { margin-top: 64px; } }
@media (min-width: 1024px) { .sec-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: center; gap: 64px; } }
.band--dark .checks li { color: rgba(251, 249, 244, .8); }
.band--dark .checks li::before { border-color: #FBF9F4; }
.smock { overflow: hidden; border: 1px solid rgba(251, 249, 244, .15); border-radius: 4px; }
.smock__bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid rgba(251, 249, 244, .1); background: #1F1B15; font: 400 10px/1.5 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(251, 249, 244, .6); }
.dot7 { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: rgba(251, 249, 244, .4); }
.smock__body { position: relative; height: 176px; background: radial-gradient(circle, rgba(251, 249, 244, .07) 1px, transparent 1px) 0 0 / 16px 16px; }
@media (min-width: 640px) { .smock__body { height: 208px; } }
.alert { position: absolute; right: 12px; bottom: 12px; max-width: 16rem; padding: 10px 12px; border: 1.5px solid #FF5A1F; border-radius: 4px; background: #FBF9F4; color: #1A1714; transition: border-color .2s var(--ease); }
.alert__row { display: flex; align-items: center; gap: 10px; }
.alert__t { display: grid; font-size: 13px; font-weight: 600; line-height: 1.375; }
.alert__t > span, .alert .mbtn > span { grid-area: 1 / 1; transition: opacity .2s var(--ease); }
.alert .mbtn { display: inline-grid; margin-top: 10px; }
.alert .t-off { opacity: 0; }
.alert.is-off { border-color: #B9AF9E; }
.alert.is-off .t-on { opacity: 0; }
.alert.is-off .t-off { opacity: 1; }
.alert.is-off .node { animation: none; background: #B9AF9E; box-shadow: none; }
.alert.is-off .mbtn--danger:not(.is-pressed) { background: #FBF9F4; color: #1A1714; }

/* Precios: tarjetas de planes; "Empresa" con cabecera en tinta y "Más completo" */
.plans-note { margin-top: 24px; max-width: 42rem; }
.plans { display: grid; gap: 20px; margin-top: 48px; }
@media (min-width: 1024px) { .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.plan { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: var(--stamp-sm); }
@media (min-width: 1024px) { .plan { min-height: 21rem; } }
.plan__head { padding: 20px; border-bottom: 1px solid var(--border); }
@media (min-width: 640px) { .plan__head { padding-inline: 24px; } }
.plan__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.plan__name { font-size: 20px; line-height: 28px; }
.plan__price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 16px; }
.plan__price b { font: 700 36px/40px var(--f-display); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.plan__price span { font: 400 12px/16px var(--f-mono); color: var(--muted); }
.plan .checks { flex: 1; align-content: start; padding: 20px; }
@media (min-width: 640px) { .plan .checks { padding-inline: 24px; } }
.plan--top { border-color: var(--stroke); box-shadow: var(--stamp); }
.plan--top .plan__head { background: #14110D; color: #FBF9F4; border-bottom-color: var(--stroke); }
.plan--top .plan__price span { color: rgba(251, 249, 244, .75); }
.plans-foot { display: flex; flex-direction: column; gap: 24px; margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
.plans-foot .txt { max-width: 42rem; }
@media (min-width: 1024px) { .plans-foot { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; } }
@media (max-width: 639px) { .plans-foot .btn { width: 100%; } }
/* =============================================================================
   10. EXPERIENCIA (#experiencia) · pasos del sitio convertidos en línea de tiempo
   ============================================================================= */
.step__dot > i.is-live { background: var(--accent); animation: breathe 1.8s ease-in-out infinite; }
.xp-when { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.xp-org { margin-top: 10px; font-size: 18px; font-weight: 500; line-height: 1.4; }
.xp-loc { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.xp-loc .ico { width: 15px; height: 15px; }
.step .checks { margin-top: 20px; gap: 12px; }
.xp-tech .mchips { margin-top: 12px; }

/* =============================================================================
   11. PROYECTOS (#proyectos)
   ============================================================================= */
.pj-grid { display: grid; gap: 20px; margin-top: 48px; }
@media (min-width: 640px) { .pj-grid { margin-top: 64px; } }
@media (min-width: 1024px) { .pj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pj { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: var(--stamp-sm); }
.pj__head { padding: 20px; border-bottom: 1px solid var(--border); }
@media (min-width: 640px) { .pj__head { padding: 24px; } }
.pj__top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 12px; }
.pj__top .chip { align-items: flex-start; padding: 3px 8px; white-space: normal; text-align: left; font-size: 11px; line-height: 1.45; letter-spacing: .02em; text-transform: none; }
.pj__top .chip .node { margin-top: 3px; }
.pj__top .chip .node { margin-top: 1px; }
.pj__name { margin-top: 16px; font-size: 28px; line-height: 1.1; }
.pj__meta { margin-top: 8px; font: 400 11px/1.5 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pj__kind { margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.pj__body { flex: 1; display: grid; align-content: start; gap: 22px; padding: 20px; }
@media (min-width: 640px) { .pj__body { padding: 24px; } }
.pj__tagline { font-size: 17px; font-weight: 500; line-height: 1.5; text-wrap: pretty; }
.pj__metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; border: 1px solid var(--border); border-radius: 2px; background: var(--border); }
.pj__metric { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 4px; min-width: 0; padding: 12px; background: var(--paper); }
.pj__metric dd { font: 700 26px/1.1 var(--f-display); letter-spacing: -.025em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pj__metric dt { font-size: 12px; line-height: 1.4; color: var(--muted); }
.pj__block > .kicker { display: block; margin-bottom: 12px; }
.pj__block .checks--sm li { color: var(--muted); }
.more { border-top: 1px solid var(--border); }
.more summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; cursor: pointer; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more__box { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border: 1px solid var(--stroke); border-radius: 2px; background: var(--card); box-shadow: var(--stamp-sm); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
.more summary:hover .more__box { transform: translate(-1px, -1px); box-shadow: var(--stamp); }
.more__box .ico { width: 16px; height: 16px; transition: transform .2s var(--ease); }
.more[open] .more__box .ico { transform: rotate(45deg); }
.more .txt-sm { padding-bottom: 6px; }
:root { interpolate-size: allow-keywords; }
.more::details-content { block-size: 0; overflow-y: clip; transition: block-size .2s var(--ease), content-visibility .2s allow-discrete; }
.more[open]::details-content { block-size: auto; }
.pj__foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--border); font: 400 11px/1.5 var(--f-mono); letter-spacing: .08em; color: var(--muted); }
@media (min-width: 640px) { .pj__foot { padding-inline: 24px; } }
.pj__foot .ico { width: 14px; height: 14px; }

/* =============================================================================
   12. APTITUDES (#aptitudes) · el número es en cuántos proyectos la usé
   ============================================================================= */
.sk-note { margin-top: 24px; max-width: 42rem; }
.sk-grid { display: grid; gap: 16px; margin-top: 48px; }
@media (min-width: 640px) { .sk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .sk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
.sk-card { padding: 20px 20px 12px; }
.sk-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
.sk-card__t { font-size: 18px; line-height: 1.25; }
.sk { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 6px 12px; padding: 10px 0 12px; border-top: 1px solid var(--border); }
.sk__name { font-size: 15px; font-weight: 500; line-height: 1.35; }
.sk__n { font: 400 11px/1.2 var(--f-mono); color: var(--muted); white-space: nowrap; }
.sk__bar { grid-column: 1 / -1; height: 4px; overflow: hidden; border-radius: 2px; background: var(--card-2); }
.sk__bar i { display: block; height: 100%; border-radius: 2px; background: var(--fg); transform-origin: 0 50%; transform: scaleX(var(--v, 0)); }
.js .sk-card:not(.is-in) .sk__bar i { transform: scaleX(0); }
.js .sk-card.is-in .sk__bar i { transition: transform 1s var(--ease) calc(var(--d, 0ms) + 200ms); }
.sk-card .mchips { padding: 12px 0 8px; border-top: 1px solid var(--border); }

/* =============================================================================
   13. CONTACTO (#contacto) · tarjeta final donde remata la línea de tiempo
   ============================================================================= */
.contact-band .tl { bottom: auto; height: 11rem; }
.tl-end { display: none; position: absolute; left: 0; top: 11rem; width: 64px; height: 1px; background: rgba(26, 23, 20, .4); }
[data-theme="dark"] .tl-end { background: rgba(242, 238, 229, .4); }
.tl-end::after { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); transform: translate(-50%, -50%); }
@media (min-width: 1024px) { .tl-end { display: block; } }
.cbox { position: relative; display: grid; gap: 40px; padding: 24px 20px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); box-shadow: var(--stamp); }
@media (min-width: 640px) { .cbox { padding: 40px; } }
@media (min-width: 1024px) { .cbox { grid-template-columns: minmax(0, 1fr) minmax(0, 25rem); gap: 56px; padding: 56px; align-items: start; } }
.cbox .lbl__dot { position: static; transform: none; }
.cbox .lead { margin-top: 20px; max-width: 36rem; }
.clist { margin-top: 32px; border-top: 1px solid var(--border); }
.crow { border-bottom: 1px solid var(--border); }
.clink { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 16px; min-height: 68px; padding: 10px 0; }
.clink__k { display: flex; align-items: center; gap: 8px; font: 400 11px/1.5 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.clink__k .ico { width: 15px; height: 15px; color: var(--fg); }
.clink__v { grid-column: 1; font-size: 17px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; transition: color .15s var(--ease); }
.clink__go { grid-column: 2; grid-row: 1 / 3; display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); box-shadow: var(--stamp-sm); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
.clink__go .ico { width: 16px; height: 16px; }
.clink:hover .clink__v { color: var(--accent-ink); }
.clink:hover .clink__go, .clink:focus-visible .clink__go { transform: translate(-1px, -1px); box-shadow: var(--stamp); }
.form { display: grid; gap: 18px; padding: 20px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
@media (min-width: 640px) { .form { padding: 24px; } }
.form__t { font-size: 20px; line-height: 28px; }
.field { display: grid; gap: 6px; }
.field label { font: 400 11px/1.5 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--card); color: var(--fg);
  font: 400 16px/1.5 var(--f-sans); -webkit-appearance: none; appearance: none; transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.input:focus { border-color: var(--stroke); box-shadow: var(--stamp-sm); }
.input--area { min-height: 112px; resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 14px; line-height: 1.5; color: var(--muted); cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; display: grid; place-items: center; width: 22px; height: 22px; margin: 0; border: 1px solid var(--stroke); border-radius: 2px; background: var(--card); box-shadow: var(--stamp-sm); cursor: pointer; }
.check input::before { content: ""; width: 10px; height: 5px; border-left: 2px solid #1A1714; border-bottom: 2px solid #1A1714; transform: translateY(-1px) rotate(-45deg) scale(0); transition: transform .15s var(--ease); }
.check input:checked { background: var(--accent); }
.check input:checked::before { transform: translateY(-1px) rotate(-45deg) scale(1); }
.check input[aria-invalid="true"] { border-color: var(--danger); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; color: inherit; font: inherit; text-decoration: underline; text-decoration-color: var(--line-3); text-underline-offset: 4px; transition: color .15s var(--ease); }
.link-btn:hover { color: var(--accent-ink); text-decoration-color: currentColor; }
.link-btn .ico { width: 15px; height: 15px; }
.check .link-btn { display: inline; min-height: 0; color: var(--fg); font-weight: 500; }
.form__error { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--danger); border-radius: 4px; background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; }
.form__error[hidden] { display: none; }
.form__error .ico { margin-top: 2px; color: var(--danger); }
.form__actions { display: flex; flex-wrap: wrap; gap: 12px; }
.form__hint { font-size: 13px; line-height: 1.5; color: var(--muted); }
@media (max-width: 639px) { .form__actions .btn { flex: 1 1 100%; } }

/* =============================================================================
   14. PIE DE PÁGINA + AVISO DE PRIVACIDAD (modal)
   ============================================================================= */
.ftr { background: var(--paper); padding-bottom: 40px; }
.ftr__in { padding-top: 24px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.ftr__links { display: flex; flex-wrap: wrap; gap: 0 22px; margin-top: 6px; }
.ftr__a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 500; color: var(--fg); text-underline-offset: 4px; transition: color .15s var(--ease); }
.ftr__a:hover { color: var(--accent-ink); text-decoration: underline; }
.ftr__a .ico { width: 15px; height: 15px; }
.ftr__legal { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 24px; margin-top: 10px; font-size: 12px; line-height: 1.6; }
.ftr__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; }
.modal { width: min(640px, calc(100vw - 32px)); max-width: none; max-height: min(84vh, 760px); padding: 0; border: 1px solid var(--stroke); border-radius: 4px; background: var(--card); color: var(--fg); box-shadow: var(--stamp); overflow: hidden; }
.modal::backdrop { background: rgba(20, 17, 13, .55); }
.modal[open] { animation: m-in .25s var(--rise); }
.modal.is-closing { animation: m-out .18s ease forwards; }
@keyframes m-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes m-out { to { opacity: 0; transform: translateY(6px); } }
.modal__in { display: flex; flex-direction: column; max-height: inherit; }
.modal__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 10px 10px 20px; border-bottom: 1px solid var(--stroke); background: var(--card-2); }
.modal__t { font-size: 20px; line-height: 1.3; }
.modal__body { padding: 20px 24px 24px; overflow-y: auto; }
.modal__body p { max-width: 62ch; margin-bottom: 14px; font-size: 15px; line-height: 1.625; color: var(--muted); }
.modal__body p:last-child { margin-bottom: 0; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: var(--ease); }

/* =============================================================================
   15. MOVIMIENTO REDUCIDO · sin animaciones; todo visible y en su estado final
   ============================================================================= */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .js [data-reveal], .js [data-intro] { opacity: 1 !important; transform: none !important; }
  .js .step__line { transform: translateX(-50%) !important; }
  .js .sk-card .sk__bar i { transform: scaleX(var(--v, 0)) !important; }
  .tl i, .cur, .dm-cur { display: none !important; }
  .lab__svg .led-on { opacity: 1 !important; }
  .more::details-content { transition: none; }
}

/* =============================================================================
   16. IMPRESIÓN / PDF · A4, 2–3 páginas, limpia y legible por ATS, en el idioma activo
   ============================================================================= */
@page { size: A4; margin: 10mm 12mm 10mm; }
@media print {
  :root, :root[data-theme="dark"] {
    --canvas: #fff; --paper: #fff; --card: #fff; --card-2: #fff; --fg: #111; --muted: #3b3833; --faint: #555;
    --border: #d9d3c9; --line: #d9d3c9; --line-2: #cfc8bd; --line-3: #cfc8bd; --stroke: #9a9387;
    --stamp: none; --stamp-sm: none; --pop: none; --accent-ink: #8a2d07; color-scheme: light;

  /* 5. COMPONENTES ------------------------------------------------------------------ */
  /* Encabezado de sección del sitio: punto en la línea de tiempo + número + nombre + filete */
  function lblRow(num, label, intro) {
    return h('div', intro != null ? { class: 'lbl', 'data-intro': '', vars: { i: String(intro) } } : { class: 'lbl', 'data-reveal': '' },
      h('span', { class: 'lbl__dot', 'aria-hidden': 'true' }),
      num ? h('span', { class: 'lbl__n', 'aria-hidden': 'true' }, num) : null,
      h('p', { class: 'kicker kicker--fg' }, label),
      h('span', { class: 'lbl__rule', 'aria-hidden': 'true' }));
  }
  /* Títulos-frase con punto final (el punto se oculta en la impresión) */
  function title(tag, attrs, v) {
    const el = h(tag, attrs);
    bind(() => {
      const s = String(pick(v)).trim();
      el.textContent = s;
      if (s && !/[.!?…]$/.test(s)) el.append(h('span', { class: 'end', 'aria-hidden': 'true' }, '.'));
    });
    return el;
  }
  function secHead(id) {
    const name = T('sections.' + id), line = T('headlines.' + id);
    const attrs = { id: id + '-title', class: 'h2', 'data-reveal': '', vars: { d: '60ms' } };
    /* Con ui.headlines: en pantalla una frase como en remotehubtech.com; en el PDF, el nombre llano de la sección */
    const head = has(line) ? h('h2', attrs, title('span', { class: 'h2__web' }, line), h('span', { class: 'h2__print' }, L(name)))
      : title('h2', attrs, name);
    return [lblRow(pad(SECTIONS.indexOf(id) + 1), T('nav.' + id)), head];
  }
  function subHead(code, label, text, id) {
    return [lblRow(code, label), title('h3', { id, class: 'h2', 'data-reveal': '', vars: { d: '60ms' } }, text)];
  }
  /* Contenedor del sitio + riel con la línea de tiempo */
  function railOf(...kids) {
    return h('div', { class: 'wrap' }, h('div', { class: 'rail' }, h('span', { class: 'tl', 'aria-hidden': 'true' }, h('i')), kids));
  }
  /* Descargar PDF: el archivo del idioma activo (meta.pdf); sin él, la impresión del navegador */

    bind(() => { const f = pick(D.meta.pdf); a.setAttribute('href', f); a.setAttribute('download', f.split('/').pop()); });
    return a;
  }
  function mkBand(cls, id, ...kids) { return h('div', { class: 'band ' + (cls || ''), id: id || null }, railOf(...kids)); }
  /* Botón del sitio: principal naranja o secundario claro; ambos con sombra dura */
  function button(o) {
    const isLink = !!o.href;
    return h(isLink ? 'a' : 'button', Object.assign({
      class: 'btn' + (o.variant === 'ghost' ? '' : ' btn--primary') + (o.size ? ' btn--' + o.size : ''),
      href: isLink ? o.href : null, type: isLink ? null : (o.type || 'button'),
      target: o.ext ? '_blank' : null, rel: o.ext ? 'noopener noreferrer' : null,
      on: o.onClick ? { click: o.onClick } : null

      o.lead ? iconEl(o.lead) : null,

  function extLink(href, text, cls) {
    return h('a', { href, class: cls || null, target: '_blank', rel: 'noopener noreferrer' }, breakable(text), h('span', { class: 'sr-only' }, ' ', T('newTab')));
  }
  function breakable(text) {
    const f = doc.createDocumentFragment();
    String(text || '').split(/(?<=[/@])/).forEach((chunk, i) => { if (i) f.append(h('wbr')); f.append(chunk); });
    return f;
  }
  /* Nombres clave en tinta dentro de un texto (empresa y producto) */
  function richText(el, v) {
    const terms = [D.company.name, D.product.name].filter(Boolean).sort((a, b) => b.length - a.length);
    const re = terms.length ? new RegExp('(' + terms.map(escRe).join('|') + ')', 'g') : null;
    bind(() => {
      el.textContent = '';
      const s = String(pick(v));
      if (!re) { el.textContent = s; return; }
      s.split(re).forEach((part, i) => { if (part) el.append(i % 2 ? h('b', null, part) : part); });
    });
    return el;
  }
  /* Número animado: el visible es decorativo; el lector de pantalla recibe el valor final */
  function counter(value, suffix, cls) {
    const raw = typeof value === 'number' ? value : String(value == null ? '' : value).trim();
    let n = NaN, sfx = suffix || '';
    if (typeof raw === 'number') n = raw;
    else { const m = /^(\d+)(\+?)$/.exec(raw); if (m) { n = Number(m[1]); sfx = m[2] + sfx; } }
    if (!isFinite(n)) return h('span', { class: cls || null }, String(raw) + sfx);
    const vis = h('span', { 'aria-hidden': 'true', 'data-count': String(n), 'data-suffix': sfx });
    const sr = h('span', { class: 'sr-only' });
    bind(() => { const t = fmtNum(n) + sfx; sr.textContent = t; if (!vis.dataset.running) vis.textContent = t; });
    return h('span', { class: cls || null }, vis, sr);
  }
  /* Periodo con un solo punto de corte: "oct. 2026 –" / "Actualidad" */
  function periodText(v) {
    const NB = ' ';
    const f = (s) => String(s || '').split(/\s+[–—-]\s+/).map((p) => p.replace(/\s+/g, NB)).join(NB + '– ');
    return isLoc(v) ? { es: f(pick(v, 'es')), en: f(pick(v, 'en')) } : f(v);

        h('h2', { class: 'modal__t', id: 'privacy-title' }, has(pr.title) ? pr.title : T('actions.privacy')),
        h('button', { type: 'button', class: 'ibtn modal__close', 'aria-label': T('actions.close'), html: icon('close'), on: { click: closeModal } })),
      body));
  }
  /* Metadatos que cambian con el idioma (el JSON-LD es estático en el head) */
  function setMeta(attr, key, val) {
    let m = doc.head.querySelector('meta[' + attr + '="' + key + '"]');
    if (!m) { m = doc.createElement('meta'); m.setAttribute(attr, key); doc.head.append(m); }
    m.setAttribute('content', val);
  }
  function renderMeta() {
    const p = D.person;
    const ttl = [p.name, pick(p.title)].filter(Boolean).join(' · ');
    const desc = [pick(p.title), pick(p.companyLine), pick(p.location)].filter(Boolean).join(' · ');
    if (ttl) doc.title = ttl;
    setMeta('name', 'description', [p.name, desc].filter(Boolean).join(' · '));
    ['og:title', 'og:image:alt'].forEach((k) => setMeta('property', k, ttl));
    setMeta('property', 'og:description', desc);
    setMeta('name', 'twitter:title', ttl);
    setMeta('name', 'twitter:description', desc);
    setMeta('property', 'og:locale', state.lang === 'en' ? 'en_US' : 'es_CO');
    setMeta('property', 'og:locale:alternate', state.lang === 'en' ? 'es_CO' : 'en_US');
  }
  /* 7. MAQUETAS VIVAS · bucles que corren solo en pantalla y se detienen con la pestaña oculta */
  const STOP = {};
  const lives = [];
  const onReveal = new Map();
  let printing = false;
  function live(el, run, still) { lives.push({ el, run, still, tk: null, vis: false }); }
  function liveStart(o) {
    if (o.tk || reduced() || printing || doc.hidden) return;
    const t = o.tk = { off: false, id: 0, rej: null };
    const wait = (ms) => new Promise((res, rej) => {
      if (t.off) { rej(STOP); return; }
      t.rej = rej;
      t.id = setTimeout(() => { t.rej = null; res(); }, ms);
    });
    (async () => {
      try { for (;;) await o.run(wait); } catch (e) { if (e !== STOP) console.error(e); }
    })();
  }
  function liveStop(o) {
    const t = o.tk;
    if (!t) return;
    t.off = true; clearTimeout(t.id); o.tk = null;
    if (t.rej) t.rej(STOP);
    if (o.still) o.still();
  }
  function livesPause(on) { lives.forEach((o) => { if (on) liveStop(o); else if (o.vis) liveStart(o); }); }
  async function typeInto(el, text, ms, wait) {
    for (let i = 1; i <= text.length; i += 1) { el.textContent = text.slice(0, i); await wait(ms + Math.round(Math.random() * 35)); }
  }
  function typeOnce(el, text, ms, delay) {
    let i = 0;
    const tick = () => { i += 1; el.textContent = text.slice(0, i); if (i < text.length) setTimeout(tick, ms + Math.round(Math.random() * 40)); };
    setTimeout(tick, delay || 0);
  }
  function rest(box, cur) {
    cur.style.setProperty('--x', Math.round(box.clientWidth * 0.82) + 'px');
    cur.style.setProperty('--y', Math.round(box.clientHeight * 0.86) + 'px');
  }
  /* El cursor viaja hasta el botón y lo presiona (se hunde y pierde la sombra, como en el sitio) */
  async function press(box, cur, target, wait, strong) {
    const b = box.getBoundingClientRect(), r = target.getBoundingClientRect();
    cur.classList.remove('is-off');
    cur.style.setProperty('--x', Math.round(r.left - b.left + r.width * 0.56) + 'px');
    cur.style.setProperty('--y', Math.round(r.top - b.top + r.height * 0.58) + 'px');
    await wait(900);
    cur.classList.add('is-click'); target.classList.add('is-pressed');
    await wait(strong ? 230 : 190);
    target.classList.remove('is-pressed');
    await wait(420);
    cur.classList.remove('is-click');
  }
  function initLive() {
    lives.forEach((o) => { if (o.still) o.still(); });
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      const o = lives.find((x) => x.el === e.target);
      if (!o) return;
      o.vis = e.isIntersecting;
      if (o.vis) liveStart(o); else liveStop(o);
    }), { rootMargin: '0px 0px -8% 0px' });
    lives.forEach((o) => io.observe(o.el));
  }

  /* 8. MOVIMIENTO · apariciones sobrias, contadores, roles que se escriben y líneas de tiempo que se dibujan */
  let revealIO = null;
  function reveal(el, instant) {
    if (el.classList.contains('is-in')) return;
    el.classList.add('is-in');
    $$('[data-count]', el).forEach(instant ? finishCount : countUp);
    const fn = onReveal.get(el);
    if (fn) { onReveal.delete(el); fn(instant); }
  }
  function showInstantly(els) {
    if (!els.length) return;
    els.forEach((el) => { el.classList.add('no-anim'); reveal(el, true); });
    void root.offsetHeight;
    setTimeout(() => els.forEach((el) => el.classList.remove('no-anim')), 80);
  }
  function initReveal() {
    const targets = $$('[data-reveal]');
    if (reduced() || !('IntersectionObserver' in window)) { showInstantly(targets); return; }
    /* Ya en pantalla al cargar pero lejos del primer pantallazo (pantallas muy altas, capturas): sin animación */
    const vh = window.innerHeight, limit = Math.min(vh, 1000) * 0.85;
    showInstantly(targets.filter((t) => { const r = t.getBoundingClientRect(); return r.top > limit && r.top < vh && r.bottom > 0; }));
    revealIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { revealIO.unobserve(e.target); reveal(e.target); } }), { rootMargin: '0px 0px -40px 0px', threshold: 0 });
    targets.forEach((t) => { if (!t.classList.contains('is-in')) revealIO.observe(t); });
  }
  function revealAll() { $$('[data-reveal]').forEach((el) => { if (revealIO) revealIO.unobserve(el); reveal(el, true); }); }

  /* Contadores: cuentan una sola vez al aparecer */
  function finishCount(el) { delete el.dataset.running; el.dataset.done = '1'; el.textContent = fmtNum(Number(el.dataset.count)) + (el.dataset.suffix || ''); }
  function countUp(el) {
    if (el.dataset.done) return;
    el.dataset.done = '1';
    const to = Number(el.dataset.count), sfx = el.dataset.suffix || '';
    if (!isFinite(to) || to === 0 || reduced() || printing) { finishCount(el); return; }
    const dur = 1300, t0 = performance.now(), ease = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
    el.dataset.running = '1';
    el.textContent = fmtNum(0) + sfx;
    const step = (now) => {
      if (!el.dataset.running) return;
      const p = clamp((now - t0) / dur);
      if (p < 1) { el.textContent = fmtNum(Math.round(to * ease(p))) + sfx; requestAnimationFrame(step); } else finishCount(el);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if (el.dataset.running) finishCount(el); }, dur + 200);
  }
  function finishCounters() { $$('[data-count]').forEach(finishCount); }

  /* Roles con efecto de escritura (aria-hidden; la versión estática está en .sr-only) */
  const typing = { timer: 0, i: 0, pos: 0, del: false, on: false, paused: false };
  const roleList = () => arr(D.person.rotatingRoles).filter(has);
  function later(ms) { clearTimeout(typing.timer); if (typing.on && !typing.paused) typing.timer = setTimeout(typeTick, ms); }
  function typeTick() {
    const el = $('.typed'), roles = roleList();
    if (!el || !roles.length) return;
    const full = String(pick(roles[typing.i % roles.length]));
    if (!typing.del) {
      typing.pos = Math.min(full.length, typing.pos + 1);
      el.textContent = full.slice(0, typing.pos);
      if (typing.pos >= full.length) { typing.del = true; later(1900); return; }
      later(45 + Math.random() * 45);
      return;
    }
    typing.pos = Math.max(0, typing.pos - 1);
    el.textContent = full.slice(0, typing.pos);
    if (typing.pos === 0) { typing.del = false; typing.i = (typing.i + 1) % roles.length; later(380); return; }
    later(22);
  }
  function startTyping(hold) {
    clearTimeout(typing.timer);
    const el = $('.typed'), roles = roleList();
    if (!el || !roles.length) return;
    const first = String(pick(roles[0]));
    typing.i = 0; typing.pos = first.length; typing.del = true; typing.paused = false;
    el.textContent = first;
    if (reduced() || roles.length < 2) { typing.on = false; return; }
    typing.on = true;
    later(hold == null ? 2400 : hold);
  }
  function pauseTyping() { typing.paused = true; clearTimeout(typing.timer); }
  function resumeTyping() { if (!typing.paused) return; typing.paused = false; later(350); }

  /* Línea de tiempo global: el filete se rellena de tinta a medida que se lee */
  let railsUpdate = null;
  function initRails() {
    const fills = $$('.tl > i');
    if (!fills.length) return;
    railsUpdate = () => {
      if (reduced() || printing) return;
      const a = (window.innerHeight || 1) * 0.6;
      const vals = fills.map((f) => { const r = f.parentElement.getBoundingClientRect(); return r.height ? clamp((a - r.top) / r.height) : 0; });
      fills.forEach((f, k) => { f.style.transform = 'scaleY(' + vals[k].toFixed(4) + ')'; });
    };
  }
  function initScroll() {
    let ticking = false;
    const run = () => { ticking = false; if (railsUpdate) railsUpdate(); };
    const queue = () => { if (!ticking) { ticking = true; requestAnimationFrame(run); } };
    window.addEventListener('scroll', queue, { passive: true });
    window.addEventListener('resize', queue, { passive: true });
    run();
  }
  /* Scrollspy: subraya en la navegación la sección que ocupa el centro de la pantalla */
  function initSpy() {
    const set = (id) => $$('[data-spy]').forEach((a) => { if (a.dataset.spy === id) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    set('inicio');
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) set(e.target.id); }), { rootMargin: '-42% 0px -52% 0px', threshold: 0 });
    ['inicio'].concat(SECTIONS).forEach((id) => { const s = doc.getElementById(id); if (s) io.observe(s); });
  }
  /* Pausa de animaciones con la pestaña oculta o fuera de vista */
  function initPausing() {
    doc.addEventListener('visibilitychange', () => {
      root.classList.toggle('is-hidden', doc.hidden);
      if (doc.hidden) pauseTyping(); else resumeTyping();
      livesPause(doc.hidden);
    });
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle('is-paused', !e.isIntersecting)), { rootMargin: '80px 0px' });
    $$('[data-pausable]').forEach((el) => io.observe(el));
    const hero = $('#inicio');
    if (hero) new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { if (!doc.hidden) resumeTyping(); } else pauseTyping(); })).observe(hero);
  }

  /* 9. INTERACCIONES · idioma, tema, menú, aviso de privacidad, formulario e impresión */
  function resolveLang() {
    const q = params.get('lang');
    if (q === 'es' || q === 'en') return q;
    const s = store.get('cv-lang');
    if (s === 'es' || s === 'en') return s;
    return D.meta.defaultLang === 'en' ? 'en' : 'es';
  }
  function resolveTheme() {
    const q = params.get('theme');
    if (q === 'dark' || q === 'light') return q;
    return store.get('cv-theme') === 'dark' ? 'dark' : 'light';
  }
  function syncParam(key, val) {
    if (!params.has(key)) return;
    params.set(key, val);
    try { window.history.replaceState(window.history.state, '', window.location.pathname + '?' + params.toString() + window.location.hash); } catch (e) { /* file:// */ }
  }
  /* Transición suave (fundido corto) al cambiar idioma o tema */
  function withTransition(run) {
    if (!doc.startViewTransition || reduced()) { run(); return; }
    try { const vt = doc.startViewTransition(run); vt.finished.catch(() => {}); vt.ready.catch(() => {}); vt.updateCallbackDone.catch(() => {}); } catch (e) { run(); }
  }
  function updateToggles() {
    $$('.seg__btn').forEach((b) => {
      const on = b.dataset.lang === state.lang;
      b.setAttribute('aria-pressed', String(on));
      if (on) b.removeAttribute('title'); else b.setAttribute('title', pick(T('actions.langSwitch')));
    });
    const tb = $('#theme-btn');
    if (tb) { tb.setAttribute('aria-pressed', String(state.theme === 'dark')); tb.setAttribute('title', pick(T(state.theme === 'dark' ? 'actions.themeLight' : 'actions.themeDark'))); }
  }
  function applyTheme(t) {
    state.theme = t;
    root.setAttribute('data-theme', t);
    $$('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', THEME_COLOR[t] || THEME_COLOR.light));
    updateToggles();
  }
  function toggleTheme() {
    const next = state.theme === 'dark' ? 'light' : 'dark';
    store.set('cv-theme', next);
    syncParam('theme', next);
    withTransition(() => applyTheme(next));
  }
  function applyLang(l) {
    state.lang = l;
    root.setAttribute('lang', l);
    updaters.forEach((fn) => fn());
    renderMeta();
    updateToggles();
    startTyping(250);
    if (railsUpdate) railsUpdate();
  }
  function setLang(l) {
    if (l === state.lang) return;
    store.set('cv-lang', l);
    syncParam('lang', l);
    withTransition(() => applyLang(l));
  }

  /* Menú compacto (debajo del encabezado, como en el sitio) */
  function toggleMenu() { const m = $('#menu'); if (m && m.hidden) openMenu(); else closeMenu(false); }
  function openMenu() {
    const m = $('#menu'), b = $('#menu-btn');
    if (!m || !m.hidden) return;
    m.hidden = false; m.classList.add('is-open');
    if (b) { b.setAttribute('aria-expanded', 'true'); b.innerHTML = icon('close'); }
  }
  function closeMenu(focusBtn) {
    const m = $('#menu'), b = $('#menu-btn');
    if (!m || m.hidden) return;
    m.hidden = true; m.classList.remove('is-open');
    if (b) { b.setAttribute('aria-expanded', 'false'); b.innerHTML = icon('menu'); if (focusBtn) b.focus(); }
  }
  function initKeys() {
    doc.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const m = $('#menu'); if (m && !m.hidden) { e.preventDefault(); closeMenu(true); } } });
    doc.addEventListener('click', (e) => { const m = $('#menu'), nav = $('#nav'); if (m && !m.hidden && nav && !nav.contains(e.target)) closeMenu(false); });
  }

  /* Aviso de privacidad (<dialog> nativo + foco atrapado + Esc) */
  function trapFocus(e, box) {
    if (e.key !== 'Tab') return;
    const f = $$('a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', box).filter((el) => el.getClientRects().length);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (doc.activeElement === first || !box.contains(doc.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (doc.activeElement === last || !box.contains(doc.activeElement))) { e.preventDefault(); first.focus(); }
  }
  let modalReturn = null;
  function openModal(opener) {
    const dlg = $('#privacy');
    if (!dlg || dlg.open) return;
    modalReturn = opener || doc.activeElement;
    dlg.classList.remove('is-closing');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    const c = $('.modal__close', dlg);
    if (c) c.focus();
  }
  function closeModal() {
    const dlg = $('#privacy');
    if (!dlg || !dlg.open || dlg.classList.contains('is-closing')) return;
    const finish = () => {
      dlg.classList.remove('is-closing');
      if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
      if (modalReturn && modalReturn.focus) modalReturn.focus();
    };
    if (reduced()) { finish(); return; }
    dlg.classList.add('is-closing');
    setTimeout(finish, 170);
  }
  function initModal() {
    const dlg = $('#privacy');
    if (!dlg) return;
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); closeModal(); });
    dlg.addEventListener('click', (e) => { if (e.target === dlg) closeModal(); });
    dlg.addEventListener('keydown', (e) => trapFocus(e, dlg));
  }

  /* Formulario: valida, arma el mensaje y abre WhatsApp o el correo del visitante (no hay servidor) */
  let formError = null;
  updaters.push(() => { const t = $('#cf-error .form__error-t'); if (formError && t) t.textContent = pick(formError); });
  function clearError() {
    formError = null;
    const box = $('#cf-error');
    if (box) box.hidden = true;
    $$('#contact-form [aria-invalid]').forEach((x) => { x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
  }
  function showError(v, field) {
    const box = $('#cf-error');
    if (!box) return;
    clearError();
    formError = v;
    $('.form__error-t', box).textContent = pick(v);
    box.hidden = false;
    if (field) { field.setAttribute('aria-invalid', 'true'); field.setAttribute('aria-describedby', 'cf-error'); field.focus(); }
  }
  function onFormInput() { if (formError) clearError(); }
  function onSubmit(e) {
    e.preventDefault();
    const form = e.currentTarget, c = D.contact;
    const via = e.submitter && e.submitter.value === 'email' ? 'email' : 'whatsapp';
    const nameEl = form.elements.namedItem('name'), msgEl = form.elements.namedItem('message'), consent = form.elements.namedItem('consent');
    const name = nameEl ? nameEl.value.trim() : '', msg = msgEl ? msgEl.value.trim() : '';
    if (!msg) { showError(T('formMessageRequired'), msgEl); return; }
    if (!consent || !consent.checked) { showError(T('labels.formConsentRequired'), consent); return; }
    clearError();
    const text = (name ? pick(fmt(T('greeting'), { name })) + '\n\n' : '') + msg;
    if (via === 'email' && c.email) window.location.href = 'mailto:' + c.email + '?subject=' + encodeURIComponent(pick(T('mailSubject'))) + '&body=' + encodeURIComponent(text);
    else if (c.whatsapp) window.open(c.whatsapp + (c.whatsapp.indexOf('?') >= 0 ? '&' : '?') + 'text=' + encodeURIComponent(text), '_blank', 'noopener');
  }

  /* Impresión: todo visible, cifras finales y maquetas quietas */
  function initPrint() {
    window.addEventListener('beforeprint', () => { printing = true; livesPause(true); revealAll(); finishCounters(); });
    window.addEventListener('afterprint', () => { printing = false; livesPause(false); if (railsUpdate) railsUpdate(); });
  }

  /* 10. ARRANQUE ------------------------------------------------------------------------ */
  function debounce(fn, ms) { let t = 0; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
  function init() {
    state.lang = resolveLang();
    state.theme = resolveTheme();
    root.setAttribute('lang', state.lang);
    bind(() => { const s = $('.skip'); if (s) s.textContent = pick(T('actions.skip')); });
    renderHeader();
    renderHero();
    renderStats();
    renderPerfil();
    renderEmpresa();
    renderRemoteHub();
    renderExperiencia();
    renderProyectos();
    renderAptitudes();
    renderIdiomas();
    renderContacto();
    renderFooter();
    renderModal();
    renderMeta();
    applyTheme(state.theme);

    initReveal();
    initRails();
    initScroll();
    initSpy();
    initPausing();
    initModal();
    initKeys();
    initPrint();
    initLive();
    startTyping();
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-loaded')));

    window.addEventListener('resize', debounce(() => { if (railsUpdate) railsUpdate(); if (window.innerWidth >= 1280) closeMenu(false); }, 150));
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(() => { if (railsUpdate) railsUpdate(); }).catch(() => {});
    if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', () => { if (reduced()) { revealAll(); finishCounters(); startTyping(0); livesPause(true); } });
  }
  init();
})();
</script>
</body>
